    <style>
        body {
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        ruby rt {
            font-size: 0.6em;
            color: #64748b;
            user-select: none;
        }
        .hide-furigana ruby rt {
            display: none !important;
        }
        .Japanese-text {
            line-height: 2.2;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .Japanese-text {
            -webkit-touch-callout: none;
        }
        .confetti-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            background-color: #f2d74e;
            top: -10%;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }
        .confetti:nth-child(2n) { background-color: #95c3de; }
        .confetti:nth-child(3n) { background-color: #ff9a91; }
        .confetti:nth-child(4n) { background-color: #a0f0bd; }
        .confetti:nth-child(5n) { background-color: #c096ff; }
    </style>

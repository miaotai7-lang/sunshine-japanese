
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sunshine - AI 日语学习</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 1rem);
            --base-font-size: 1.125rem; /* 18px */
            --ruby-font-size: 0.55em;
            --grammar-color: #ef4444; /* 红色 */
            --particle-color: #10b981; /* 绿色 */
            --place-color: #92400e;   /* 褐色 */
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
            padding-bottom: calc(5rem + var(--safe-bottom)); 
        }
        ruby {
            ruby-align: center;
            ruby-position: over;
        }
        ruby rt {
            font-size: var(--ruby-font-size);
            color: #6366f1;
            user-select: none;
            padding-bottom: 0.15em;
        }
        /* 语义化标记样式 */
        .g-syntax { color: var(--grammar-color); font-weight: 700; }
        .g-particle { color: var(--particle-color); font-weight: 500; }
        .g-place { color: var(--place-color); font-weight: 600; text-decoration: underline decoration-dotted; }

        .hide-colors .g-syntax, 
        .hide-colors .g-particle, 
        .hide-colors .g-place {
            color: inherit !important;
            font-weight: inherit !important;
            text-decoration: none !important;
        }

        .Japanese-text {
            font-size: var(--base-font-size) !important;
            line-height: 2.8 !important; 
            word-break: break-all;
        }
        .hide-furigana ruby rt { display: none !important; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
